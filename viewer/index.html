<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>4D Viewer</title>
<meta name="description" content="Open 4D Gaussian-splat scenes (.nx4d, .nxs4) and static splats (.ply, .spz, .sog, .glb, .splat, .ksplat, .usdz) in the browser. Files never leave your device." />
<meta name="theme-color" content="#08090c" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
<style>
  html, body { margin: 0; height: 100%; background: #08090c; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #viewer { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="viewer"></div>
<script type="module">
  import { mountViewer } from './js/index.js';
  // Standalone page: scene, ui, gpu, up, t, cam … come from the query string.
  // The handle is kept on window as a diagnostic surface for real devices.
  window.__tg4dHandle = mountViewer(document.getElementById('viewer'), { fromUrl: true });
</script>
</body>
</html>

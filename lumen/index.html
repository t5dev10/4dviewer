<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<script>
  // This page answers at the site root and, as 404.html, at any /<scene> path:
  // pin relative URLs to the site base (the repository path on *.github.io).
  (function () {
    var seg = location.pathname.split('/');
    var base = location.hostname.endsWith('.github.io') && seg.length > 2 && seg[1] ? '/' + seg[1] + '/' : '/';
    var b = document.createElement('base');
    b.href = base;
    document.head.appendChild(b);
  })();
</script>
